name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Тестовый показ: подпапка репозитория, весь сайт закрыт от индексации (noindex + robots Disallow).
      # Приёмник заявок не выбран – PUBLIC_FORM_ENDPOINT пуст, формы честно пишут «Тестовая версия».
      - run: npm run build
        env:
          PUBLIC_BASE: /reyting-nsk
          PUBLIC_SITE_URL: https://tema-mail.github.io/reyting-nsk
          PUBLIC_NOINDEX: '1'
          PUBLIC_FORM_ENDPOINT: ''
      - run: node scripts/check-links.mjs
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
